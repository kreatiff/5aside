services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 5aside
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      WEBHOOK_SHARED_SECRET: ${WEBHOOK_SHARED_SECRET}
      DEFAULT_GAME_FEE_CENTS: ${DEFAULT_GAME_FEE_CENTS:-1500}
      APP_TIMEZONE: ${APP_TIMEZONE:-Australia/Brisbane}
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
